<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Payment Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #666;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .chart-box,
        .table-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Customer Payment Dashboard</h1>
</header>

<div class="container">

    <div class="filters">
        <h3>Filters</h3>

        <label>From:</label>
        <input type="date" id="fromDate">

        <label>To:</label>
        <input type="date" id="toDate">

        <label>Mobile:</label>
        <input type="text" id="mobileSearch"
               placeholder="Search mobile number">

        <button onclick="applyFilters()">Search</button>
        <button onclick="resetFilters()">Reset</button>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Amount</h3>
            <p id="totalAmount">₹0</p>
        </div>

        <div class="card">
            <h3>Total Customers</h3>
            <p id="totalCustomers">0</p>
        </div>

        <div class="card">
            <h3>Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>

    </div>

    <div class="chart-box">
        <h2>Daily Collection</h2>
        <canvas id="paymentChart"></canvas>
    </div>

    <div class="table-box">
        <h2>Customer Transactions</h2>

        <table>
            <thead>
                <tr>
                    <th>Mobile Number</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="dataTable"></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
