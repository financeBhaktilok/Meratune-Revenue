<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Dashboard</title>

    <!-- Excel reader -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card h3 {
            margin: 0;
            color: #666;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 0;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f1f1;
        }

        #status {
            padding: 10px;
            color: #555;
        }

        @media(max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Customer Payment Dashboard</h1>
    <div id="status">Loading Excel data...</div>
</header>

<div class="container">

    <div class="filters">

        <h3>Filters</h3>

        <label>From:</label>
        <input type="date" id="fromDate">

        <label>To:</label>
        <input type="date" id="toDate">

        <input
            type="text"
            id="mobileSearch"
            placeholder="Search Mobile Number"
        >

        <button onclick="applyFilters()">Search</button>
        <button onclick="resetFilters()">Reset</button>

    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Amount</h3>
            <p id="totalAmount">₹0</p>
        </div>

        <div class="card">
            <h3>Total Customers</h3>
            <p id="totalCustomers">0</p>
        </div>

        <div class="card">
            <h3>Total Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>

    </div>

    <div class="box">
        <h2>Daily Collection</h2>
        <canvas id="paymentChart"></canvas>
    </div>

    <div class="box">

        <h2>Customer Transactions</h2>

        <table>

            <thead>
                <tr>
                    <th>Mobile Number</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="dataTable"></tbody>

        </table>

    </div>

</div>

<script>

let allData = [];
let chart = null;


/* Load Excel file */
async function loadExcel() {

    try {

        const response = await fetch("customers.xlsx");

        if (!response.ok) {
            throw new Error("Excel file not found");
        }

        const buffer = await response.arrayBuffer();

        const workbook = XLSX.read(buffer, {
            type: "array",
            cellDates: true
        });

        const sheetName = workbook.SheetNames[0];

        const worksheet = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(
            worksheet,
            { defval: "" }
        );

        allData = rows.map(row => {

            return {
                mobile: String(row["Mobile Number"]).trim(),

                amount: Number(
                    String(row["Amount"])
                    .replace(/,/g, "")
                    .replace(/[₹$]/g, "")
                    .trim()
                ),

                date: convertDate(row["Date"])
            };

        }).filter(row =>
            row.mobile &&
            !isNaN(row.amount) &&
            row.date
        );

        document.getElementById("status").innerText =
            "Excel data loaded successfully";

        displayData(allData);

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Error loading customers.xlsx";
    }
}


/* Convert Excel date */
function convertDate(value) {

    if (value instanceof Date) {

        return value.toISOString().split("T")[0];

    }

    if (typeof value === "number") {

        const date = XLSX.SSF.parse_date_code(value);

        return `${date.y}-${String(date.m).padStart(2,"0")}-${String(date.d).padStart(2,"0")}`;

    }

    const date = new Date(value);

    if (!isNaN(date)) {

        return date.toISOString().split("T")[0];

    }

    return "";
}


/* Display dashboard */
function displayData(data) {

    const totalAmount = data.reduce(
        (sum, row) => sum + row.amount,
        0
    );

    const customers = new Set(
        data.map(row => row.mobile)
    ).size;

    document.getElementById("totalAmount").innerText =
        "₹" + totalAmount.toLocaleString("en-IN");

    document.getElementById("totalCustomers").innerText =
        customers.toLocaleString("en-IN");

    document.getElementById("totalTransactions").innerText =
        data.length.toLocaleString("en-IN");


    /* Table */

    const table = document.getElementById("dataTable");

    table.innerHTML = "";

    data.forEach(row => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${row.mobile}</td>
            <td>₹${row.amount.toLocaleString("en-IN")}</td>
            <td>${row.date}</td>
        `;

        table.appendChild(tr);

    });


    createChart(data);
}


/* Create chart */
function createChart(data) {

    const daily = {};

    data.forEach(row => {

        if (!daily[row.date]) {
            daily[row.date] = 0;
        }

        daily[row.date] += row.amount;

    });

    const dates = Object.keys(daily).sort();

    const amounts = dates.map(
        date => daily[date]
    );


    if (chart) {
        chart.destroy();
    }


    chart = new Chart(
        document.getElementById("paymentChart"),
        {

            type: "line",

            data: {

                labels: dates,

                datasets: [{
                    label: "Daily Collection",
                    data: amounts,
                    tension: 0.3
                }]

            },

            options: {

                responsive: true,

                scales: {

                    y: {
                        beginAtZero: true
                    }

                }

            }

        }
    );
}


/* Filters */
function applyFilters() {

    const from =
        document.getElementById("fromDate").value;

    const to =
        document.getElementById("toDate").value;

    const mobile =
        document.getElementById("mobileSearch")
        .value
        .trim();


    const filtered = allData.filter(row => {

        if (from && row.date < from) {
            return false;
        }

        if (to && row.date > to) {
            return false;
        }

        if (
            mobile &&
            !row.mobile.includes(mobile)
        ) {
            return false;
        }

        return true;

    });


    displayData(filtered);
}


/* Reset */
function resetFilters() {

    document.getElementById("fromDate").value = "";

    document.getElementById("toDate").value = "";

    document.getElementById("mobileSearch").value = "";

    displayData(allData);
}


/* Start */
loadExcel();

</script>

</body>
</html>
